services:
  gateway:
    build: ./apigateway
    ports:
      - "8083:8083"
    depends_on:
      - auth-service
      - user-service

  auth-service:
    build: ./authservice
    ports:
      - "8081:8081"
    depends_on:
      - auth-db

  user-service:
    build: ./userservice-clean
    ports:
      - "8080:8080"
    depends_on:
      - user-db
      - redis

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: userservice
      POSTGRES_USER: userservice
      POSTGRES_PASSWORD: userservice
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - redis-data:/data

volumes:
  postgres_data:
  auth-db-data:
  redis-data: