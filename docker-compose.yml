services:
  gateway:
    build: ./apigateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8083:8083"
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started

  auth-service:
    build: ../authservice
    environment:
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy

  user-service:
    build: ../userservice-clean
    ports:
      - "8080:8080"
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d authdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5436:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: userservice
      POSTGRES_USER: userservice
      POSTGRES_PASSWORD: userservice
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U userservice -d userservice" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  postgres_data:
  auth-db-data:
  redis-data: